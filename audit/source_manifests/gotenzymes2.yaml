citation: "GotEnzymes2 (LiLabTsinghua/GotEnzymes2, MIT): benchmarking + prediction dataset for enzyme kinetics + thermal properties. 19 prediction CSVs from UniKP / EITLEM / DLKcat / CataPro / TurNuP / DeepEnzyme / Boost / Seq2Topt across kcat, Km, kcat/Km, Topt, Tm. v0.1 corpus uses UniKP-KCAT × UniKP-KM merged on (Sequence, Smiles, EC, Organism) yielding 16,890 paired (kcat, Km) soft-pseudo-label rows."
rights_notes: "MIT (repo) + CC BY 4.0 (web app data). Used as curriculum pre-training only per PRD §12.1; soft pseudo-labels weighted lower than BRENDA + EnzyExtract during CEKM training. Conditions (temp, pH) not in upstream — defaulted to 25 °C / pH 7.0 in JSONL."
