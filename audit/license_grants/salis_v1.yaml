isolation_evidence: |
  src/zer0pa_synbio/adapters/l6_host_engineering/salis_rbs_subprocess.py
  invokes the Salis v1.0 binary via subprocess.run(..., capture_output=True)
  and parses stdout. No Python `import` of any GPL module. The CLI binary's
  output is parsed as text; only numeric initiation rates and confidence
  values cross the boundary back into the synbio (proprietary) codebase.
  This isolation is the standard practice for GPL-isolation in commercial
  R&D and is documented in the audit-trail spec under § Subprocess isolation.
